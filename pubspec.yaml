name: supreme_portfolio
description: Moe Kyaw Aung | Senior Android Developer Portfolio
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # State & Theming
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1

  # Animations & UI
  animated_text_kit: ^4.2.2
  flutter_animate: ^4.5.0
  flutter_staggered_grid_view: ^0.7.0

  # Images & Network
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.0

  # SEO & Performance
  flutter_sitemap: ^0.1.0
  visibility_detector: ^0.4.0+2

  # Utilities
  intl: ^0.19.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/

flutter_icons:
  android: true
  ios: true
  web: true
  image_path: "assets/images/icon.png"
